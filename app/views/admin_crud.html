<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>CRUD Vazamentos - SOS Golpes</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <h1>Gerenciar Vazamentos de Senhas</h1>
    <nav><a href="/admin_panel">Painel Admin</a></nav>

    <h2 id="formTitulo">Adicionar Registro</h2>
    <form id="formAddLeak">
        <input type="hidden" id="id_leak">
        <label>Hash da Senha (SHA-256):</label>
        <input type="text" id="senha_hash" required>
        <label>Fonte do Vazamento:</label>
        <input type="text" id="fonte" required>
        <button type="submit" id="btnSubmit">Adicionar</button>
        <button type="button" id="btnCancelEdit" style="display:none; margin-left: 8px;">Cancelar edição</button>
    </form>
    <div id="mensagem"></div>

    <h2>Registros de Vazamentos</h2>
    <table>
        <thead><tr><th>ID</th><th>Hash da Senha</th><th>Fonte</th><th>Ações</th></tr></thead>
        <tbody id="tabela-leaks">
        </tbody>
    </table>
    <script src="/static/js/admin_crud.js"></script>
</body>
</html>
