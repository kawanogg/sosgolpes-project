apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: sos-golpes
  labels:
    app: db
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          args:
            - "--default-authentication-plugin=mysql_native_password"
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              value: sos_golpes
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: MYSQL_ROOT_PASSWORD
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/mysql
            - name: db-schema
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: db-data
        - name: db-schema
          configMap:
            name: db-schema
