apiVersion: apps/v1
kind: Deployment
metadata:
  name: user
  namespace: sos-golpes
  labels:
    app: user
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user
  template:
    metadata:
      labels:
        app: user
    spec:
      containers:
        - name: user
          image: sos-golpes-user:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: MYSQL_ROOT_PASSWORD
          envFrom:
            - secretRef:
                name: app-secret
          volumeMounts:
            - name: rsa-keys
              mountPath: /var/keys
              readOnly: true
      volumes:
        - name: rsa-keys
          secret:
            secretName: rsa-keys
