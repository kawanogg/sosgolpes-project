<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SOS Golpes</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="barra-navegacao">
        <div class="recipiente conteudo-navegacao">
            <h1 class="logotipo">SOS<span>Golpes</span></h1>
            <ul class="links-navegacao" id="menuNavegacao">
            </ul>
        </div>
    </nav>

    <main class="recipiente">
        <section class="secao-login">
            <div class="cabecalho-secao">
                <h2>Login</h2>
            </div>

            <div class="cartao cartao-formulario">
                <form id="formularioLogin">
                    <div class="grupo-formulario">
                        <label for="usernameInput">Email:</label>
                        <div class="envoltorio-entrada">
                            <input type="text" id="emailInput" name="email" placeholder="E-mail" required>
                        </div>
                        <label for="passwordInput">Senha:</label>
                        <div class="envoltorio-entrada">
                            <input type="password" id="passwordInput" name="password" placeholder="Senha" required>
                        </div>
                    </div>

                    <button type="submit" id="btnLogin" class="botao botao-primario">
                        Fazer login
                    </button>
                </form>

                <form id="formularioNovaSenha" style="display: none;">
                    <p style="margin-bottom: 20px; color: #555; text-align: center;">
                        Este é o seu primeiro acesso em uma conta de administrador. Por favor, defina uma nova senha definitiva para a sua conta.
                    </p>
                    
                    <div class="grupo-formulario">
                        <label for="nomeInput">Seu Nome Completo:</label>
                        <div class="envoltorio-entrada">
                            <input type="text" id="nomeInput" name="nome" placeholder="Digite seu nome" required>
                        </div>
                        <label for="novaSenhaInput">Nova Senha:</label>
                        <div class="envoltorio-entrada">
                            <input type="password" id="novaSenhaInput" name="novaSenha" placeholder="Introduza a sua nova senha" required>
                        </div>
                        <label for="confirmaSenhaInput">Confirmar Senha:</label>
                        <div class="envoltorio-entrada">
                            <input type="password" id="confirmaSenhaInput" name="confirmaSenha" placeholder="Confirme a sua nova senha" required>
                        </div>
                    </div>

                    <button type="submit" id="btnNovaSenha" class="botao botao-primario">
                        Confirmar Nova Senha
                    </button>
                    
                    <button type="button" id="btnCancelarNovaSenha" class="botao botao-secundario" style="margin-top: 10px; width: 100%;">
                        Cancelar
                    </button>
                </form>
            </div>
        </section>
    </main>

    <footer class="rodape">
        <div class="recipiente">
            <p>&copy; 2026 SOS Golpes. Projeto de Utilidade Social.</p>
        </div>
    </footer>

    <script src="/js/nav_bar.js"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="/js/login.js"></script>
</body>
</html>
