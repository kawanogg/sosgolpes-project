name: "CI/CD Pipeline"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  Bandit:
    name: Bandit Scan (SAST)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Instalação do Bandit
        run: pip install bandit
    
      - name: Executar Bandit
        run: bandit -r . -ll -x ./venv

  SnykSAST:
    name: Snyk Scan (SAST)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Snyk
        uses: snyk/actions/setup@master

      - name: Snyk Code Scan (SAST)
        run: snyk code test --org=${{ secrets.SNYK_ORG }}
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}


  SnykSCA:
    name: Snyk Scan (SCA)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Snyk SCA
        uses: snyk/actions/python@0.4.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: --file=requirements.txt --org=${{ secrets.SNYK_ORG }}

  SemgrepSAST:
    name: Semgrep Scan (SAST)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v6
      - run: semgrep ci
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  build:
    name: Build
    needs: [Bandit, SnykSAST, SnykSCA, SemgrepSAST]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build da imagem
        run: docker build -t sos-golpes:latest .

      - name: Salvar imagem como artefato
        run: docker save sos-golpes:latest -o sos-golpes.tar

      - name: Upload do artefato
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: sos-golpes.tar

  ZapDAST:
    name: OWASP ZAP (DAST)
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download do artefato
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Carregar imagem
        run: docker load -i sos-golpes.tar

      - name: Subir aplicação
        run: |
          docker run -d --network=host \
            --name sos-golpes sos-golpes:latest
          sleep 10

      - name: OWASP ZAP Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://localhost:8080"

  push:
    name: Push to Docker Hub
    needs: ZapDAST
    runs-on: ubuntu-latest

    steps:
      - name: Download do artefato
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Carregar imagem
        run: docker load -i sos-golpes.tar

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Tag e push para o Docker Hub
        run: |
          docker tag sos-golpes:latest ${{ secrets.DOCKER_USERNAME }}/sos-golpes:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/sos-golpes:latest

      - name: Deslogar do Docker Hub
        run: docker logout