name: "CI/CD Pipeline"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  TestesUnitarios:
    name: Testes Unitarios (OWASP)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias de teste
        run: pip install -r tests/requirements.txt

      - name: Executar Pytest
        run: pytest tests/ -v

  Bandit:
    name: Bandit Scan (SAST)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Instalação do Bandit
        run: pip install bandit
    
      - name: Executar Bandit
        run: bandit -r . -ll -x ./venv

  SnykSAST:
    name: Snyk Scan (SAST)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Snyk
        uses: snyk/actions/setup@master

      - name: Snyk Code Scan (SAST)
        run: snyk code test --org=${{ secrets.SNYK_ORG }}
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}


  SnykSCA-matrix:
    name: Snyk Scan (SCA) Matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [admin, audit, identity, reports, threat, user]

    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Snyk CLI
        uses: snyk/actions/setup@master
      
      - name: Instalar dependências do Microserviço
        run: |
          pip install -r services/${{ matrix.service }}/requirements.txt
      
      - name: Snyk SCA
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk test --file=services/${{ matrix.service }}/requirements.txt \
                    --package-manager=pip \
                    --org=${{ secrets.SNYK_ORG }}

  SnykSCA:
    name: Snyk Scan (SCA)
    needs: SnykSCA-matrix
    runs-on: ubuntu-latest
    steps:
      - run: echo "Todos os services passaram com sucesso (Snyk SCA)"

  SemgrepSAST:
    name: Semgrep Scan (SAST)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v6
      - run: semgrep ci
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  build-service-matrix:
    name: Build Service Matrix
    needs: [TestesUnitarios, Bandit, SnykSAST, SnykSCA, SemgrepSAST]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [admin, audit, identity, reports, threat, user]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build e push da imagem (${{ matrix.service }})
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/sos-golpes-${{ matrix.service }}:${{ github.sha }} ./services/${{ matrix.service }}
          docker push ${{ secrets.DOCKER_USERNAME }}/sos-golpes-${{ matrix.service }}:${{ github.sha }}
      
      - name: Deslogar do Docker Hub
        run: docker logout

  build-infra-matrix:
    name: Build Infra Matrix
    needs: [TestesUnitarios, Bandit, SnykSAST, SnykSCA, SemgrepSAST]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [frontend, api-gateway]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build e push da imagem ${{ matrix.service }}
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/sos-golpes-${{ matrix.service }}:${{ github.sha }} ./${{ matrix.service }}
          docker push ${{ secrets.DOCKER_USERNAME }}/sos-golpes-${{ matrix.service }}:${{ github.sha }}
      
      - name: Deslogar do Docker Hub
        run: docker logout

  build:
    name: Build
    needs: [build-service-matrix, build-infra-matrix]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Todos os builds temporários foram enviados ao Docker Hub"

  push-service-matrix:
    name: Push Service Matrix
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [admin, audit, identity, reports, threat, user]
    steps:
      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Tag e push de Homologação/Produção
        run: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/sos-golpes-${{ matrix.service }}:${{ github.sha }}
          docker tag ${{ secrets.DOCKER_USERNAME }}/sos-golpes-${{ matrix.service }}:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/sos-golpes-${{ matrix.service }}:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/sos-golpes-${{ matrix.service }}:latest

      - name: Deslogar do Docker Hub
        run: docker logout
  
  push-infra-matrix:
    name: Push Infra Matrix
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [frontend, api-gateway]
    steps:
      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Tag e Push de Homologação/Produção
        run: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/sos-golpes-${{ matrix.service }}:${{ github.sha }}
          docker tag ${{ secrets.DOCKER_USERNAME }}/sos-golpes-${{ matrix.service }}:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/sos-golpes-${{ matrix.service }}:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/sos-golpes-${{ matrix.service }}:latest
      
      - name: Deslogar do Docker Hub
        run: docker logout

  push:
    name: Push to Docker Hub
    needs: [push-service-matrix, push-infra-matrix]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Todos os pushs para o Docker Hub da matriz passaram com sucesso"

  deploy-kuber:
    name: Deploy (CD) Kubernetes
    needs: push
    runs-on: self-hosted
    if: github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && github.event_name == 'push')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Garantir cluster kind (sosgolpes)
        run: |
          if ! kind get clusters | grep -qx sosgolpes; then
            kind create cluster --name sosgolpes --config kubernetes/kind-cluster.yaml
          fi
          kubectl config use-context kind-sosgolpes

      - name: Config dos Secrets
        run: |
          kubectl apply -f kubernetes/namespace.yaml

          kubectl create secret generic db-secret -n sos-golpes \
            --from-literal=MYSQL_ROOT_PASSWORD="${{ secrets.MYSQL_ROOT_PASSWORD }}" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic app-secret -n sos-golpes \
            --from-literal=COGNITO_USER_POOL_ID="${{ secrets.COGNITO_USER_POOL_ID }}" \
            --from-literal=COGNITO_CLIENT_ID="${{ secrets.COGNITO_CLIENT_ID }}" \
            --from-literal=COGNITO_CLIENT_SECRET="${{ secrets.COGNITO_CLIENT_SECRET }}" \
            --from-literal=AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}" \
            --from-literal=AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
            --from-literal=AWS_DEFAULT_REGION="${{ secrets.AWS_DEFAULT_REGION }}" \
            --from-literal=GOOGLE_SAFE_BROWSING_KEY="${{ secrets.GOOGLE_SAFE_BROWSING_KEY }}" \
            --from-literal=VIRUSTOTAL_KEY="${{ secrets.VIRUSTOTAL_KEY }}" \
            --dry-run=client -o yaml | kubectl apply -f -

          if ! kubectl -n sos-golpes get secret rsa-keys >/dev/null 2>&1; then
            openssl genrsa -out /tmp/private_key.pem 2048
            openssl rsa -in /tmp/private_key.pem -pubout -out /tmp/public_key.pem
            kubectl create secret generic rsa-keys -n sos-golpes \
              --from-file=private_key.pem=/tmp/private_key.pem \
              --from-file=public_key.pem=/tmp/public_key.pem
          fi

      - name: Aplicar manifests
        run: |
          kubectl apply -f kubernetes/namespace.yaml
          kubectl apply -f kubernetes/db/configmap-schema.yaml
          kubectl apply -f kubernetes/db/pvc.yaml
          kubectl apply -f kubernetes/db/deployment.yaml
          kubectl apply -f kubernetes/db/service.yaml
          for svc in identity user threat admin audit reports frontend; do
            kubectl apply -f kubernetes/$svc/deployment.yaml
            kubectl apply -f kubernetes/$svc/service.yaml
          done
          kubectl apply -f kubernetes/api-gateway/configmap-nginx.yaml
          kubectl apply -f kubernetes/api-gateway/deployment.yaml
          kubectl apply -f kubernetes/api-gateway/service.yaml

      - name: Atualizar imagens para a tag do commit
        run: |
          for svc in identity user threat admin audit reports frontend api-gateway; do
            kubectl -n sos-golpes set image deployment/$svc \
              $svc=${{ secrets.DOCKER_USERNAME }}/sos-golpes-$svc:${{ github.sha }}
          done

      - name: Aguardar
        run: |
          for svc in identity user threat admin audit reports frontend api-gateway; do
            kubectl -n sos-golpes rollout status deployment/$svc --timeout=180s
          done