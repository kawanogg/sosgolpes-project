name: "CI/CD Pipeline"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  Bandit:
    name: Bandit Scan (SAST)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Instalação do Bandit
        run: pip install bandit
    
      - name: Executar Bandit
        run: bandit -r . -ll -x ./venv

  SnykSAST:
    name: Snyk Scan (SAST)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Snyk
        uses: snyk/actions/setup@master

      - name: Snyk Code Scan (SAST)
        run: snyk code test --org=${{ secrets.SNYK_ORG }}
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}


  SnykSCA:
    name: Snyk Scan (SCA)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Snyk SCA
        uses: snyk/actions/python@0.4.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: --file=requirements.txt --org=${{ secrets.SNYK_ORG }}

  build:
    name: Build & Push
    needs: [Bandit, SnykSAST, SnykSCA]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Criacao da imagem e push para o Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/sos-golpes:latest

      - name: Deslogar do Docker Hub
        run: docker logout
