<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auditoria de Senhas - SOS Golpes</title>
    <link rel="stylesheet" href="/main/static/css/style.css">
</head>
<body>
    <nav class="barra-navegacao">
        <div class="recipiente conteudo-navegacao">
            <h1 class="logotipo">SOS<span>Golpes</span></h1>
            <ul class="links-navegacao">
                <li><a href="link_analysis.html">Analisar Link</a></li>
                <li><a href="password_checker.html" class="ativo">Auditoria de Senha</a></li>
                <li><a href="history.html">Meu Historico</a></li>
            </ul>
        </div>
    </nav>

    <main class="recipiente">
        <section class="secao-auditoria">
            <div class="cabecalho-secao">
                <h2>Verificador de Seguranca de Senha</h2>
                <p>Verifique se a sua senha ja foi exposta em vazamentos de dados na internet.</p>
            </div>

            <div class="cartao cartao-formulario">
                <form id="formularioAuditoriaSenha" action="/main/php/processar_senha.php" method="POST">
                    
                    <div class="grupo-formulario">
                        <label for="senha">Digite a senha que deseja verificar:</label>
                        <div class="envoltorio-entrada">
                            <svg class="icone-entrada" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                            <input type="password" id="senha" name="senha_clara" placeholder="" required>
                        </div>
                    </div>

                    <input type="hidden" id="carga_criptografada" name="carga_criptografada">

                    <button type="submit" class="botao botao-primario">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                        Verificar Seguranca
                    </button>
                </form>
            </div>

            <div id="resultadoAuditoria" class="caixa-resultado oculto">
                </div>
        </section>
    </main>

    <footer class="rodape">
        <div class="recipiente">
            <p>&copy; 2026 SOS Golpes. Projeto de Utilidade Social.</p>
        </div>
    </footer>

    <script src="/main/static/js/crypto_rsa.js"></script>
</body>
</html>
